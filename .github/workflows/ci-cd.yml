name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build


  deploy-vercel:
    name: Deploy to Vercel
    needs: test

    # Only deploy when the workflow was triggered by a push to main.
    # Pull requests can run the test job but must never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: |
          vercel link \
            --yes \
            --scope="$VERCEL_ORG_ID" \
            --project="$VERCEL_PROJECT_ID" \
            --token="$VERCEL_TOKEN"

      - name: Pull Vercel production environment
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --scope="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN"

      - name: Build Vercel project
        run: |
          vercel build \
            --prod \
            --scope="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --scope="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN"